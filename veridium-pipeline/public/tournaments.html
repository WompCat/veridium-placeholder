<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tournaments · Veridium</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  main.dir { grid-template-columns: minmax(0, 1fr); max-width: 1000px; }
  h1.page { font-size: 26px; margin: 0 0 4px; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .t-card { display: grid; gap: 12px; padding: 18px 20px; color: inherit; }
  a.t-card:hover { border-color: #c7cbff; }
  .t-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .t-top h2 { margin: 0; font-size: 17px; }
  .t-meta { color: var(--muted); font-size: 12px; }
  .podium { display: flex; gap: 8px; flex-wrap: wrap; }
  .podium span { display: inline-flex; gap: 6px; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .place { font-weight: 800; min-width: 2.2em; display: inline-block; }
  .place.p1 { color: #b8860b; } .place.p2 { color: #7d8597; } .place.p3 { color: #a0522d; }
  .hidden-row { opacity: .55; }
</style>
</head>
<body data-page="tournaments">
<header id="site-header"></header>
<main class="dir" id="main">
  <section class="card pad empty">Loading…</section>
</main>
<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  // One page, three views: all tournaments, one tournament (?id=), one organizer (?organizer=).
  const params = new URLSearchParams(location.search);
  const ordinal = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10] ?? 'th');
  const placeTag = (n) => `<span class="place p${n <= 3 ? n : ''}">${ordinal(n)}</span>`;
  const day = (d) => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const meta = (t) => [t.game, t.region, day(t.date)].filter(Boolean).map(esc).join(' · ');
  const organizerLink = (t) => `<a href="tournaments.html?organizer=${encodeURIComponent(t.organizerId)}">${esc(t.organizerName)}</a>`;
  const show = (html) => { $('main').innerHTML = html; };

  const intro = `<section class="card pad"><div class="head-row">
      <div><h1 class="page">Tournaments</h1>
        <div class="sub">Results recorded by tournament organizers Veridium has approved. Placements show on each player's profile.</div></div>
      <a class="btn" href="organizer.html">Run tournaments? Become an organizer</a></div></section>`;

  function card(t) {
    const podium = (t.podium ?? []).map((r) => `<span>${placeTag(r.placement)}${esc(r.player.riotId.split('#')[0])}${r.team ? ` <small class="t-meta">${esc(r.team)}</small>` : ''}</span>`).join('');
    return `<a class="card t-card" href="tournaments.html?id=${encodeURIComponent(t.id)}">
      <div class="t-top"><h2>${esc(t.name)}</h2><span class="t-meta">${meta(t)}</span></div>
      <div class="t-meta">Organized by ${esc(t.organizerName)} · ${t.resultCount} result${t.resultCount === 1 ? '' : 's'}</div>
      ${podium ? `<div class="podium">${podium}</div>` : ''}</a>`;
  }

  async function listView() {
    const list = await api('/api/tournaments');
    show(intro + `<section class="list">${list.length ? list.map(card).join('')
      : '<div class="card pad empty">No tournament results yet. Organizers can <a href="organizer.html">apply here</a>.</div>'}</section>`);
  }

  async function tournamentView(id) {
    const t = await api(`/api/tournaments/${encodeURIComponent(id)}`);
    document.title = `${t.name} · Veridium`;
    const rows = t.results.map((r) => `<tr class="${r.hidden ? 'hidden-row' : ''}">
        <td>${placeTag(r.placement)}</td>
        <td><a href="${profileUrl(r.player)}"><b>${esc(r.player.riotId)}</b></a></td>
        <td>${esc(r.team ?? '—')}</td>
        <td>${esc(fmtBestRank(r.player))}${r.hidden ? ' <span class="pill">Player said "Not me"</span>' : ''}</td></tr>`).join('');
    show(`<section class="card pad"><div class="head-row">
        <div><a href="tournaments.html" class="t-meta">← All tournaments</a>
          <h1 class="page" style="margin-top:6px">${esc(t.name)}</h1>
          <div class="sub">${meta(t)} · Organized by ${organizerLink(t)}</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${t.url ? `<a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener nofollow">Tournament page ↗</a>` : ''}
          ${t.mine ? `<a class="btn primary" href="organizer.html#t-${encodeURIComponent(t.id)}">Manage results</a>` : ''}</div></div></section>
      <section class="card pad"><h2>Results</h2>
        ${rows ? `<div class="table-wrap"><table><thead><tr><th>Place</th><th>Player</th><th>Team</th><th>Rank</th></tr></thead><tbody>${rows}</tbody></table></div>`
          : '<div class="empty">No results recorded yet.</div>'}</section>`);
  }

  async function organizerView(id) {
    const o = await api(`/api/organizers/${encodeURIComponent(id)}`);
    document.title = `${o.name} · Veridium`;
    show(`<section class="card pad">
        <a href="tournaments.html" class="t-meta">← All tournaments</a>
        <h1 class="page" style="margin-top:6px">${esc(o.name)} <span class="pill">Approved organizer</span></h1>
        ${o.description ? `<p>${esc(o.description)}</p>` : ''}
        <div class="sub">${o.website ? `<a href="${esc(o.website)}" target="_blank" rel="noopener nofollow">${esc(o.website)}</a> · ` : ''}Approved by Veridium ${esc(fmtDate(o.approvedAt))}</div></section>
      <section class="list">${o.tournaments.length ? o.tournaments.map(card).join('') : '<div class="card pad empty">No tournaments recorded yet.</div>'}</section>`);
  }

  (params.get('id') ? tournamentView(params.get('id')) : params.get('organizer') ? organizerView(params.get('organizer')) : listView())
    .catch((err) => show(`<section class="card pad empty">${esc(err.message)}. <a href="tournaments.html">See all tournaments</a></section>`));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veridium</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  main.home { max-width: 1320px; grid-template-columns: 290px minmax(0, 1fr) 330px; align-items: start; }
  .col { display: grid; gap: 16px; align-content: start; min-width: 0; }

  /* Me card */
  .me-banner { height: 84px; border-radius: 14px 14px 0 0; background: var(--banner); }
  .me-body { padding: 0 18px 18px; margin-top: -42px; }
  .me-body .avatar { width: 84px; height: 84px; font-size: 32px; color: #fff; }
  .me-name { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 800; margin-top: 8px; }
  .me-name a { color: var(--text); }
  .me-rank { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--bg); }
  .me-rank b { display: block; font-size: 15px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .tile .label { font-size: 11px; color: var(--muted); }
  .tile .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .game-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .game-icon.sm { width: 38px; height: 38px; font-size: 12px; border-radius: 9px; }
  .game-icon.muted { background: #e8eaf3; color: var(--muted); }
  .links { display: grid; gap: 8px; margin-top: 12px; }
  .links a { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; color: var(--text); font-weight: 500; font-size: 13px; }
  .links a:hover { background: var(--bg); }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .section-head a { font-size: 12px; font-weight: 600; }

  /* Composer */
  .composer { display: flex; gap: 12px; align-items: center; }
  .composer input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font: inherit; background: var(--bg); color: var(--muted); }
  .actions3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .actions3 a { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; }
  .actions3 a:hover { background: #e2e5ff; }

  /* Feed */
  .post-head { display: flex; align-items: center; gap: 12px; }
  .post-head .mini-avatar, .post-head .org-chip { width: 42px; height: 42px; font-size: 16px; }
  .post-head b a { color: var(--text); }
  .post-text { margin: 12px 0; }
  .org-chip { border-radius: 10px; background: linear-gradient(135deg, #2f3bd6, #11145a); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
  .match-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 170px; }
  .match-card .info { padding: 14px 16px; display: grid; gap: 10px; }
  .match-card .art { background: radial-gradient(circle at 70% 40%, #8b7bff 0, transparent 55%), var(--banner); }
  .match-top { display: flex; align-items: center; gap: 12px; }
  .match-cols { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 12px; color: var(--muted); }
  .match-cols b { display: block; color: var(--text); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .roster-banner { margin-top: 12px; border-radius: 12px; background: linear-gradient(110deg, #0c0e24, #1d1b4d); color: #fff; padding: 18px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .roster-banner .org-name { font-size: 20px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; flex: 0 1 180px; }
  .roster-list { display: flex; gap: 16px; flex-wrap: wrap; border-left: 1px solid rgba(255,255,255,.18); padding-left: 20px; flex: 1; }
  .roster-list .kicker { flex-basis: 100%; font-size: 11px; letter-spacing: .08em; opacity: .7; }
  .roster-list div { text-align: center; font-size: 12px; }
  .roster-list .mini-avatar { width: 40px; height: 40px; margin: 0 auto 4px; font-size: 15px; border: 2px solid rgba(255,255,255,.5); }
  .roster-list small { opacity: .7; display: block; }
  .post-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* Right column */
  .row-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .row-item:last-child { border-bottom: 0; }
  .row-item .grow { flex: 1; min-width: 0; }
  .row-item .grow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .game-tiles div { border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; text-align: center; font-size: 11px; color: var(--muted); }
  .game-tiles .game-icon { width: 34px; height: 34px; font-size: 11px; margin: 0 auto 6px; border-radius: 8px; }
  .game-tiles b { display: block; color: var(--text); font-size: 12px; }

  @media (max-width: 1200px) {
    main.home { grid-template-columns: 270px minmax(0, 1fr); }
    .col.right { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  }
  @media (max-width: 860px) {
    main.home { grid-template-columns: minmax(0, 1fr); }
    /* One column: me, then the feed, then everything else. */
    main.home > .col, main.home > .col.right { display: contents; }
    #me { order: 1; } .composer-card { order: 2; } #feed { order: 3; } #myGames, .quick-links { order: 4; } .col.right > * { order: 5; }
    .match-card { grid-template-columns: minmax(0, 1fr); }
    .match-card .art { display: none; }
  }
  @media (max-width: 480px) { .actions3 { grid-template-columns: 1fr; } .game-tiles { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body data-page="home">
<header id="site-header"></header>

<main class="home">
  <!-- Left: me -->
  <div class="col">
    <section class="card" id="me"><div class="pad empty">Loading…</div></section>
    <section class="card pad" id="myGames" hidden>
      <div class="section-head"><h2>My Games</h2></div>
      <div id="myGamesList"></div>
    </section>
    <section class="card pad quick-links">
      <h2>Quick Links</h2>
      <div class="links" id="quickLinks"></div>
    </section>
  </div>

  <!-- Center: composer + feed -->
  <div class="col">
    <section class="card pad composer-card">
      <div class="composer">
        <span class="mini-avatar" id="composerAvatar" style="width:42px;height:42px">?</span>
        <input disabled placeholder="Posting is coming soon. For now, your matches post themselves." aria-label="Posting is coming soon" />
      </div>
      <div class="actions3">
        <a id="shareMatch" href="players.html">🎮 Share match</a>
        <a href="jobs.html">🤝 Looking for team</a>
        <a href="players.html">🔎 Find players</a>
      </div>
    </section>
    <div class="col" id="feed"><section class="card pad empty">Loading activity…</section></div>
  </div>

  <!-- Right: what's happening -->
  <div class="col right">
    <section class="card pad">
      <div class="section-head"><h2>Open Vacancies</h2><a href="jobs.html">View all →</a></div>
      <div id="vacancies"></div>
    </section>
    <section class="card pad">
      <div class="section-head"><h2>Players on Veridium</h2><a href="players.html">View all →</a></div>
      <div id="players"></div>
    </section>
    <section class="card pad">
      <div class="section-head"><h2>Upcoming Tournaments</h2><span class="placeholder-tag">Coming soon</span></div>
      <div class="sub">Verified tournament results and brackets are on the roadmap. <a href="tournaments.html">Learn more</a></div>
    </section>
    <section class="card pad">
      <div class="section-head"><h2>Games on Veridium</h2></div>
      <div class="game-tiles" id="games"></div>
    </section>
  </div>
</main>

<script src="shell.js"></script>
<script src="common.js"></script>
<script>
  const RANK_EMBLEM = '<svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 6v9c0 7-5.5 11.5-12 13C9.5 28.5 4 24 4 17V8z" fill="#6c63ff"/><path d="M10 12l6 9 6-9" stroke="#fff" stroke-width="2.4" fill="none"/></svg>';
  const VERIFIED = '<svg width="18" height="18" viewBox="0 0 24 24" aria-label="Verified"><circle cx="12" cy="12" r="11" fill="#4f7bff"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ord = (n) => n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n] || 'th');
  const placeChip = (p) => `<span class="place ${p === 1 ? 'p1' : p <= 4 ? 'top4' : ''}">${ord(p)}</span>`;
  const name = (riotId) => riotId.split('#')[0];

  // ---- Left column: me ----
  async function loadMeProfile(me) {
    const path = `/api/players/${encodeURIComponent(me.region)}/${encodeURIComponent(me.riotId)}/profile`;
    try {
      return await api(`${path}?cached=1`); // cached first: the home page shouldn't hit Riot on every visit
    } catch {
      return loadPlayer(me.riotId, me.region);
    }
  }

  function renderSetup(message) {
    $('me').innerHTML = `
      <div class="me-banner"></div>
      <div class="me-body">
        <span class="avatar">?</span>
        <div class="me-name">Make Veridium yours</div>
        <div class="sub" style="margin-top:4px">Enter your Riot ID to see your verified TFT stats here. No account needed, it's remembered on this device.</div>
        <form class="form-row" id="meForm" style="margin-top:14px">
          <label class="field" style="flex-basis:100%">Riot ID<input name="riotId" placeholder="Name#TAG" required /></label>
          <label class="field">Region<select name="region">${regionOptions('na1')}</select></label>
          <button class="btn primary">Continue</button>
        </form>
        <div class="form-msg ${message ? 'error' : ''}" id="meMsg">${esc(message ?? '')}</div>
      </div>`;
    $('meForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      setMsg($('meMsg'), 'Loading your verified profile from Riot…');
      try {
        const p = await loadPlayer(f.riotId.trim(), f.region);
        Veridium.setMe(p.riotId, p.region);
        renderLeft();
      } catch (err) {
        setMsg($('meMsg'), err.message, 'error');
      }
    });
    $('myGames').hidden = true;
    $('composerAvatar').textContent = '?';
    renderQuickLinks(null);
  }

  function renderQuickLinks(me) {
    const links = me
      ? [[Veridium.playerHref(me.riotId, me.region), '👤', 'View my profile'],
         [Veridium.playerHref(me.riotId, me.region) + '#applications', '📨', 'My applications'],
         ['jobs.html', '💼', 'Browse vacancies'],
         ['#me', '🔁', 'Switch profile']]
      : [['players.html', '🔎', 'Find players'], ['jobs.html', '💼', 'Browse vacancies'], ['organizations.html', '🏢', 'Organizations']];
    $('quickLinks').innerHTML = links.map(([href, icon, label]) =>
      `<a href="${href}" ${label === 'Switch profile' ? 'data-switch' : ''}><span aria-hidden="true">${icon}</span>${label}</a>`).join('');
    const sw = document.querySelector('[data-switch]');
    if (sw) sw.addEventListener('click', (e) => { e.preventDefault(); Veridium.clearMe(); renderSetup(); });
  }

  async function renderLeft() {
    const me = Veridium.getMe();
    if (!me) return renderSetup();
    let p;
    try {
      p = await loadMeProfile(me);
    } catch (err) {
      return renderSetup(`Couldn't load ${me.riotId}: ${err.message}`);
    }
    const href = Veridium.playerHref(p.riotId, p.region);
    const rank = p.rank ? fmtRank(p.rank) : 'Unranked';
    const set = p.currentSet ? `Set ${p.currentSet}` : 'This set';
    $('me').innerHTML = `
      <div class="me-banner"></div>
      <div class="me-body">
        <a href="${esc(href)}" class="avatar" style="color:#fff">${esc(p.riotId.charAt(0).toUpperCase())}</a>
        <div class="me-name"><a href="${esc(href)}">${esc(name(p.riotId))}</a> ${VERIFIED}</div>
        <div class="sub">TFT Player · ${esc(p.region.toUpperCase())} · #${esc(p.riotId.split('#')[1])}</div>
        <div class="me-rank">${RANK_EMBLEM}<div><b>${esc(rank)}</b><span class="sub">${p.rank ? `${p.rank.leaguePoints} LP · ` : ''}Ranked TFT</span></div></div>
        <div class="tiles">
          <div class="tile"><div class="label">Ranked games</div><div class="value">${p.rankedMatches}</div><div class="sub">${esc(set)}</div></div>
          <div class="tile"><div class="label">Top-4 rate</div><div class="value">${p.totalMatches ? pct(p.winRate) : '–'}</div><div class="sub">${esc(set)}</div></div>
        </div>
      </div>`;
    $('composerAvatar').textContent = p.riotId.charAt(0).toUpperCase();
    $('shareMatch').href = `${href}#matches`;
    $('myGames').hidden = false;
    $('myGamesList').innerHTML = `
      <a class="game-row" href="${esc(href)}#games" style="color:inherit">
        <span class="game-icon sm">TFT</span>
        <div><b>Teamfight Tactics</b><div class="sub">${esc(rank)} · ${p.totalMatches ? `Top-4 ${pct(p.winRate)}` : 'no games this set'}</div></div>
      </a>
      <div class="sub" style="margin-top:6px">League of Legends, Valorant and more are on the way.</div>`;
    renderQuickLinks(me);
  }

  // ---- Center: feed ----
  function sessionPost(s) {
    const p = s.player;
    const href = profileUrl(p);
    const queue = s.rankedGames === s.games.length ? 'ranked' : s.rankedGames ? '' : 'normal';
    const games = `${s.games.length} ${queue ? queue + ' ' : ''}game${s.games.length === 1 ? '' : 's'}`;
    const top4 = s.games.filter((g) => g.placement <= 4).length;
    return `<article class="card pad">
      <div class="post-head">
        <a class="mini-avatar" href="${esc(href)}">${esc(p.riotId.charAt(0).toUpperCase())}</a>
        <div><b><a href="${esc(href)}">${esc(name(p.riotId))}</a></b> ${VERIFIED}
          <div class="sub">${esc(timeAgo(s.at))} · Teamfight Tactics · Set ${s.set}</div></div>
      </div>
      <p class="post-text">Played ${esc(games)} on ${esc(fmtDate(s.date + 'T12:00:00Z'))}. Best finish: <b>${ord(s.best)}</b>.</p>
      <div class="match-card">
        <div class="info">
          <div class="match-top"><span class="game-icon sm">TFT</span>
            <div><b>${ord(s.best)} Place</b> <span class="sub">best of the day</span></div></div>
          <div class="match-cols">
            <span>Rank<b>${esc(p.rank ? fmtRank(p.rank) : 'Unranked')}</b></span>
            <span>Games<b>${s.games.length}</b></span>
            <span>Avg. Place<b>${s.avgPlacement.toFixed(1)}</b></span>
            <span>Top 4<b>${top4}/${s.games.length}</b></span>
          </div>
          <div class="chips" aria-label="Placements, newest first">${s.games.map((g) => placeChip(g.placement)).join('')}</div>
        </div>
        <div class="art" aria-hidden="true"></div>
      </div>
      <div class="post-foot"><span>Verified from Riot match history</span><a href="${esc(href)}#matches">View matches →</a></div>
    </article>`;
  }

  function rosterPost(j) {
    const org = j.organization;
    const orgHref = `org.html?id=${encodeURIComponent(org.id)}`;
    return `<article class="card pad">
      <div class="post-head">
        <a class="org-chip" href="${esc(orgHref)}">${esc(initials(org.name))}</a>
        <div><b><a href="${esc(orgHref)}">${esc(org.name)}</a></b>
          <div class="sub">${esc(timeAgo(j.at))} · Organization · Roster update</div></div>
      </div>
      <p class="post-text"><a href="${esc(profileUrl(j.player))}">@${esc(name(j.player.riotId))}</a> joined the ${j.status === 'bench' ? 'bench' : 'roster'} as <b>${esc(j.role)}</b>.</p>
      <div class="roster-banner">
        <div class="org-name">${esc(org.name)}</div>
        <div class="roster-list">
          <span class="kicker">CURRENT ROSTER</span>
          ${j.roster.map((m) => `<div><span class="mini-avatar">${esc(m.riotId.charAt(0).toUpperCase())}</span>${esc(name(m.riotId))}<small>${esc(m.role)}</small></div>`).join('')}
        </div>
      </div>
    </article>`;
  }

  function vacancyPost(v) {
    const org = v.organization;
    const orgHref = `org.html?id=${encodeURIComponent(org.id)}`;
    const x = v.vacancy;
    return `<article class="card pad">
      <div class="post-head">
        <a class="org-chip" href="${esc(orgHref)}">${esc(initials(org.name))}</a>
        <div><b><a href="${esc(orgHref)}">${esc(org.name)}</a></b>
          <div class="sub">${esc(timeAgo(v.at))} · Organization · Vacancy</div></div>
      </div>
      <p class="post-text">We're recruiting: <b>${esc(x.title)}</b>${x.role ? ` <span class="pill">${esc(x.role)}</span>` : ''}</p>
      <div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="sub">${esc(x.game)} · ${esc(x.region)} · ${esc(titleCase(x.level))}</div>
        ${x.status === 'open' ? '<a class="btn primary small" href="jobs.html">Apply with your verified profile</a>' : '<span class="status closed">closed</span>'}
      </div>
    </article>`;
  }

  const FEED_PAGE = 6;
  let feedLimit = FEED_PAGE;

  async function renderFeed() {
    try {
      const items = await api(`/api/feed?limit=${feedLimit + 1}`); // one extra tells us whether there's more
      const shown = items.slice(0, feedLimit);
      $('feed').innerHTML = shown.length
        ? shown.map((i) => ({ session: sessionPost, roster_join: rosterPost, vacancy: vacancyPost })[i.type](i)).join('') +
          (items.length > feedLimit ? '<button class="expand" id="moreFeed">Show more activity <span class="chev">▾</span></button>' : '')
        : '<section class="card pad empty">No activity yet. Load a player profile or post a vacancy and it shows up here.</section>';
      $('moreFeed')?.addEventListener('click', () => {
        feedLimit += FEED_PAGE;
        renderFeed();
      });
    } catch (err) {
      $('feed').innerHTML = `<section class="card pad empty">${esc(err.message)}</section>`;
    }
  }

  // ---- Right column ----
  async function renderRight() {
    const [vacancies, players] = await Promise.all([api('/api/vacancies').catch(() => []), api('/api/players').catch(() => [])]);
    $('vacancies').innerHTML = vacancies.length ? vacancies.slice(0, 4).map((v) => `
      <div class="row-item">
        <span class="org-chip" style="width:38px;height:38px;font-size:13px">${esc(initials(v.organizationName))}</span>
        <div class="grow"><b>${esc(v.title)}</b><span class="sub">${esc(v.organizationName)} · ${esc(v.game)} · ${esc(v.region)}</span></div>
        <a class="btn small" href="jobs.html">Apply</a>
      </div>`).join('') : '<div class="sub">No open vacancies right now.</div>';
    $('players').innerHTML = players.length ? players.slice(0, 5).map((p) => `
      <div class="row-item">
        <span class="mini-avatar" style="width:38px;height:38px">${esc(p.riotId.charAt(0).toUpperCase())}</span>
        <div class="grow"><b>${esc(name(p.riotId))} <span class="verified">✔</span></b><span class="sub">TFT · ${esc(p.rank ? fmtRank(p.rank) : 'Unranked')} · ${esc(p.region.toUpperCase())}</span></div>
        <a class="btn small" href="${esc(profileUrl(p))}">View</a>
      </div>`).join('') : '<div class="sub">No players loaded yet.</div>';
    const tracked = players.length;
    $('games').innerHTML = [['TFT', 'TFT', `${tracked} player${tracked === 1 ? '' : 's'}`, true], ['LoL', 'LoL', 'Soon'], ['VAL', 'Valorant', 'Soon'], ['OW2', 'OW2', 'Soon'], ['CS2', 'CS2', 'Soon']]
      .map(([abbr, label, note, live]) => `<div><span class="game-icon ${live ? '' : 'muted'}">${abbr}</span><b>${label}</b>${note}</div>`).join('');
  }

  window.addEventListener('hashchange', () => { if (location.hash === '#me') { Veridium.clearMe(); renderSetup(); } });
  if (location.hash === '#me' && !Veridium.getMe()) renderSetup(); else renderLeft();
  renderFeed();
  renderRight();
</script>
</body>
</html>
